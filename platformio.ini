; TamaOrb builds with PlatformIO on top of ESP-IDF (ADR 0006). The CMake files stay the source of truth for
; sources and components; PlatformIO reads them. Embedded files must be listed both here and in CMake
; (main/CMakeLists.txt EMBED_TXTFILES, components/web/CMakeLists.txt target_add_binary_data).

[platformio]
src_dir = main
default_envs = spotpear_ball_128

[env:spotpear_ball_128]
; Exact pin: upgrades are deliberate and tested on the ball. 8.0.0 ships ESP-IDF 6.1.0.
platform = espressif32 @ 8.0.0
framework = espidf
board = spotpear_ball_128
board_build.partitions = partitions.csv
; Fills two gaps in PlatformIO's ESP-IDF builder: component CMake changes and web page edits (see the script).
extra_scripts = pre:tools/pio_prebuild.py
board_build.embed_txtfiles =
    main/guide_p1.md
    main/guide_p2.md
; Follows build_dir / PLATFORMIO_BUILD_DIR (a common fix for Windows' path-length limit) and the env name.
board_build.embed_files =
    ${platformio.build_dir}/${this.__env__}/esp-idf/web/index.html.gz
monitor_speed = 115200
; Keep DTR and RTS asserted: opening the port with both low resets the ESP32-S3 (measured).
monitor_dtr = 1
monitor_rts = 1
monitor_filters = esp32_exception_decoder
