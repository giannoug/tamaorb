name: CI
on: [push, pull_request]
jobs:
  firmware:
    runs-on: ubuntu-latest
    container: espressif/idf:v6.1.1
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build
        shell: bash
        run: |
          . $IDF_PATH/export.sh
          idf.py set-target esp32s3 build
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Host tests (ROM-gated tests skip without ROMs)
        run: test/host/run.sh
  tool-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r tools/requirements.txt && pytest -q tools
