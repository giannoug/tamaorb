name: CI

on:
  push:
  pull_request:

jobs:
  host-tests:
    name: Host tests (portable core)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build and run Unity tests
        run: test/host/run.sh

  tool-tests:
    name: Tool tests (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r tools/requirements.txt
      - run: pytest tools

  firmware:
    name: Firmware build (PlatformIO, espressif32 8.0.0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: platformio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
      - run: pip install platformio==6.2.0
      - run: pio run

  fuzz:
    name: Parser fuzz (ASan/UBSan, short run)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build the fuzzer
        run: |
          cmake -S test/host -B build-fuzz -DTAMAORB_FUZZ=ON -DCMAKE_BUILD_TYPE=Debug
          cmake --build build-fuzz --target fuzz_parsers -j"$(nproc)"
      - name: Fuzz 300k inputs
        working-directory: build-fuzz
        run: ./fuzz_parsers 300000 "$GITHUB_RUN_NUMBER"
      - name: Keep the crashing input
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crash
          path: build-fuzz/fuzz-crash.bin
          if-no-files-found: ignore
